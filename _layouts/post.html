---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="eyebrow">研究进展 · {{ page.date | date: "%Y-%m-%d" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.author %}<p class="byline">{{ page.author }}</p>{% endif %}
  </header>
  <div class="post-content">{{ content }}</div>
  {% if page.comments %}{% include giscus.html %}{% endif %}
</article>
