<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% if page.math %}
    <script>
      window.MathJax = {tex: {inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']]}, options: {skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']}};
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
    {% endif %}
    {% feed_meta %}
    {% seo %}
  </head>
  <body>
    <header class="site-header"><div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">FXJ<span> · Research Notes</span></a>
      <nav>
        {% if page.lang == 'en' %}
          <a href="{{ '/en/' | relative_url }}">Posts</a><a href="{{ '/en/about/' | relative_url }}">About</a>
          <a class="language-switch" href="{{ page.translation_url | default: '/' | relative_url }}" lang="zh-CN">中文</a>
        {% else %}
          <a href="{{ '/' | relative_url }}">文章</a><a href="{{ '/about/' | relative_url }}">关于</a>
          <a class="language-switch" href="{{ page.translation_url | default: '/en/' | relative_url }}" lang="en">English</a>
        {% endif %}
      </nav>
    </div></header>
    <main class="wrap main-content">{{ content }}</main>
    <footer class="site-footer"><div class="wrap">研究记录 · EvidencePatch · <a href="https://github.com/FengxianJi/FXJ-BLOG">GitHub</a></div></footer>
  </body>
</html>
