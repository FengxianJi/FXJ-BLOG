<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Matched controls for comparing recursive self-improvement agents</title>
<desc id="desc">Two RSI frameworks receive the same initial idea, data, tools, model snapshot, budget, evaluator and registered revision direction. Their full trajectories and outcomes are then compared as a paired experiment.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="620" fill="#ffffff"/>
<text x="560" y="44" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#102a43">A paired comparison holds the opportunity constant</text>
<rect x="75" y="80" width="970" height="126" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="110" y="118" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">HELD CONSTANT</text>
<text x="110" y="153" font-family="Inter,Arial,sans-serif" font-size="20" fill="#102a43">Same idea · source data · tools/model snapshot · budget · evaluator</text>
<text x="110" y="183" font-family="Inter,Arial,sans-serif" font-size="15" fill="#526477">Freeze these before either framework runs.</text>
<rect x="390" y="229" width="340" height="42" rx="21" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="560" y="256" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#9a3412">SAME REGISTERED REVISION DIRECTION</text>
<path d="M360 206 C360 242 270 253 270 294" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M760 206 C760 242 850 253 850 294" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="95" y="302" width="350" height="102" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
<text x="270" y="342" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#115e59">RSI FRAMEWORK A</text>
<text x="270" y="374" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">identify → experiment → revise → verify</text>
<rect x="675" y="302" width="350" height="102" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
<text x="850" y="342" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#5b21b6">RSI FRAMEWORK B</text>
<text x="850" y="374" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">identify → experiment → revise → verify</text>
<path d="M270 404 L270 443 L560 443 M850 404 L850 443 L560 443 L560 463" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="150" y="467" width="820" height="92" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="560" y="503" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#102a43">COMPARE PAIRED OUTCOMES</text>
<text x="560" y="533" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155">valid repair · evidence and attribution · final metric · cost · repeatability</text>
<text x="560" y="593" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b">Protocol schematic — this diagram does not report an empirical RSI comparison.</text>
</svg>
