<text x="82" y="165" font-family="Inter,Arial,sans-serif" font-size="17" fill="#102a43">Numeric + final-source checks</text><rect x="430" y="143" width="360" height="28" rx="14" fill="#0f766e"/><text x="807" y="164" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#115e59">32 / 32</text>
