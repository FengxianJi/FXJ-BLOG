<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">SciCTRL diagnostic pilot results</title>
<desc id="desc">Thirty-two of thirty-two programmatic diagnostic tasks passed numerical and source checks. Sixteen of sixteen original proposals were classified correctly. Fourteen of sixteen rewritten proposals were classified correctly, with 87.5 percent balanced accuracy and AUC 0.883. Ninety-six separate CPU control stress executions were run.</desc>
<rect width="1120" height="560" fill="#ffffff"/>
<text x="560" y="46" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#102a43">Diagnostic pilot: strong checks, limited claims</text>
<text x="82" y="105" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#475569">PASS / CORRECT CLASSIFICATION</text>
<text x="790" y="105" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#475569">OBSERVED</text>
