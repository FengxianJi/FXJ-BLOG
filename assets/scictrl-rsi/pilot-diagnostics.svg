<text x="82" y="325" font-family="Inter,Arial,sans-serif" font-size="17" fill="#102a43">Rewritten proposal blind test</text><rect x="430" y="303" width="315" height="28" rx="14" fill="#d97706"/><text x="762" y="324" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#9a3412">14 / 16</text><text x="842" y="324" font-family="Inter,Arial,sans-serif" font-size="15" fill="#64748b">balanced accuracy 87.5% · AUC 0.883</text>
